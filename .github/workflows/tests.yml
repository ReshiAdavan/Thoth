name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test,sentencepiece]'
      - run: pytest -q
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        working-directory: playground
      - run: npx playwright install --with-deps chromium
        working-directory: playground
      - run: THOTH_PREVIEW=1 npm run test:e2e
        working-directory: playground
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e '.[test,sentencepiece]' ./rust
      - run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix playground
      - run: npx playwright install --with-deps chromium
        working-directory: playground
      - name: Local implementation browser tests
        run: |
          python -m thoth_demo > /tmp/thoth-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid"' EXIT
          THOTH_LOCAL_TESTS=1 THOTH_PREVIEW=1 npm --prefix playground run test:e2e
