[package]
name = "thoth"
version = "0.2.0"
edition = "2021"
default-run = "thoth"

[lib]
name = "thoth_native"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.27", optional = true, features = ["extension-module"] }
