[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thoth-tokenizer"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["regex>=2024.5.15", "tiktoken>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
sentencepiece = ["sentencepiece>=0.2"]

[tool.setuptools]
package-dir = {"" = "python/src"}
py-modules = ["basicTokenizer", "regexTokenizer", "gpt4Tokenizer", "llama2Tokenizer", "utils", "thoth", "thoth_demo"]

[tool.pytest.ini_options]
pythonpath = ["python/src"]
testpaths = ["tests"]

[project.scripts]
thoth = "thoth:main"
